<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campagna Mediterraneo — Quadro Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link id="app-favicon" rel="icon" type="image/png" sizes="64x64" href="./assets/common/icons/favicon.png?v=1.41">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/common/icons/apple-touch-icon.png">
<link id="side-css" rel="stylesheet" href="./css/common/base.css?v=1.41">
<link rel="stylesheet" href="./css/common/nhost.css?v=1.41">
<link rel="stylesheet" href="./css/axis/base.css?v=1.41">
<link rel="stylesheet" href="./css/common/catalog.css?v=1.41">
<link rel="stylesheet" href="./css/axis/command.css?v=1.41">
<link rel="stylesheet" href="./css/common/profiles-status.css?v=1.41">
<link rel="stylesheet" href="./css/axis/navigation.css?v=1.41">
<link rel="stylesheet" href="./css/allies/command.css?v=1.41">
<link rel="stylesheet" href="./css/common/responsive.css?v=1.41">
</head>
<body>
<main id="login-page" class="login-shell">
  <div class="login-original card">
    <div class="login-motto">Mediterraneo 1940–43</div>
    <h1>Campagna W@S Mediterraneo</h1>
    <div class="nhost-app-version" style="font-family: IBM Plex Mono, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; opacity: 0.78; text-align: center; margin-top: 2px;">v1.41</div>
    <p class="note">Accesso riservato ai Quadri Comando Axis e Allies</p>
    <form id="login-form" autocomplete="on">
      <label for="email">Email della fazione</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="axis@… oppure allies@…" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label class="login-check"><input type="checkbox" id="remember"> Ricorda l'accesso</label>
      <div class="login-buttons"><button type="submit" class="btn primary" id="login-submit">Accedi</button><button type="button" class="btn" id="show-password">Mostra password</button></div>
      <p class="login-error" id="login-error" role="alert" hidden></p>
    </form>
  </div>
</main>
<div id="app-page" hidden><div id="command-root"></div></div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="dbody"><h3 id="dlg-t"></h3><div class="note" id="dlg-m"></div></div><div class="dfoot"><button class="btn primary" id="dlg-ok">Chiudi</button></div></dialog>
<script type="module" src="./js/common/main.js?v=1.41"></script>
</body>
</html>
